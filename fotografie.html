  <meta charset="utf-8">

  <meta property="og:title" content="Fotografie | KABKA">
  <meta property="og:description" content="Svadby, rodiny, tehuľky a portréty – fotografie Kataríny Babálovej.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kabkapd.com/fotografie.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://kabkapd.com/fotografie.html">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
  <div class="page">
    <header class="wrap">
      <div class="site-header">
        <a class="brand" href="/" aria-label="KABKA – úvod">
          <img src="/assets/img/kabka-logo.png" alt="">
          <span class="word">kabka</span>
        </a>
        <nav class="site-nav">
          <a class="nav-link" href="/grafika.html">Grafika</a>
          <a class="nav-link" href="/fotografie.html" aria-current="page">Fotografie</a>
          <a class="nav-link" href="/kontakt.html">Kontakt</a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      <header class="page-head fade-up">
        <p class="eyebrow">02 — Fotografie</p>
        <h1 class="display">Fotografie</h1>
        <p class="lead muted">
          Svadby, rodiny, tehuľky a portréty. Hľadám v ľuďoch ľudskosť a v momentoch to, čo sa
          neopakuje.
        </p>
      </header>

      <div class="work-grid">
        <figure style="animation-delay:0ms">
          <div class="photo-frame r-3-2">
            <img src="/assets/foto/01-svadba-luky-katka.jpg" alt="Novomanželia sa bozkávajú na svadbe" loading="lazy">
          </div>
          <figcaption>
            <span class="work-title">Luky &amp; Katka</span>
            <span class="eyebrow">Svadba</span>
          </figcaption>
        </figure>
        <figure style="animation-delay:80ms">
          <div class="photo-frame r-2-3">
            <img src="/assets/foto/02-leto-portret-cb.jpg" alt="Čiernobiely portrét ženy v slnečnicovom poli" loading="lazy">
          </div>
          <figcaption>
            <span class="work-title">Leto</span>
            <span class="eyebrow">Portrét</span>
          </figcaption>
        </figure>
        <figure style="animation-delay:160ms">
          <div class="photo-frame r-3-2">
            <img src="/assets/foto/03-rodina-objatie.jpg" alt="Mama objíma dve dcéry v žltých mikinách" loading="lazy">
          </div>
          <figcaption>
            <span class="work-title">Objatie</span>
            <span class="eyebrow">Rodina</span>
          </figcaption>
        </figure>
        <figure style="animation-delay:240ms">
          <div class="photo-frame r-3-2">
            <img src="/assets/foto/04-tehulka-ocakavanie.jpg" alt="Tehotná žena v jesennom lese drží fotku z ultrazvuku" loading="lazy">
          </div>
          <figcaption>
            <span class="work-title">Očakávanie</span>
            <span class="eyebrow">Tehuľka &amp; baby</span>
          </figcaption>
        </figure>
        <figure style="animation-delay:320ms">
          <div class="photo-frame r-2-3">
            <img src="/assets/foto/05-slnecnica-portret.jpg" alt="Portrét ženy so slnečnicou pred tvárou" loading="lazy">
          </div>
          <figcaption>
            <span class="work-title">Slnečnica</span>
            <span class="eyebrow">Portrét</span>
          </figcaption>
        </figure>
        <figure style="animation-delay:400ms">
          <div class="photo-frame r-3-2">
            <img src="/assets/foto/06-svetlo-portret.jpg" alt="Usmiata žena v slnečných okuliaroch pri západe slnka" loading="lazy">
          </div>
          <figcaption>
            <span class="work-title">Svetlo</span>
            <span class="eyebrow">Ľudia &amp; moment</span>
          </figcaption>
        </figure>
      </div>

      <div class="ig-note">
        <p>Najnovšie fotografie nájdete na Instagrame.</p>
        <a class="handle-link" href="https://www.instagram.com/kabkapd" target="_blank" rel="noreferrer">
          <span class="marker">@kabkapd</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
        </a>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap row">
        <p style="margin:0">© 2026 KABKA photography &amp; design</p>
        <div class="links">
          <a href="https://www.instagram.com/kabkapd" target="_blank" rel="noreferrer">Instagram</a>
          <a href="mailto:kabkapd@gmail.com">kabkapd@gmail.com</a>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
